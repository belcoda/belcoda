name: Dependabot Auto-merge
on:
  pull_request:
    branches: [develop] # Dependabot targets develop (see .github/dependabot.yml)
  workflow_dispatch: # manual trigger for debugging the build/check steps

permissions: {}

jobs:
  # Runs PR code (npm build/check). No secrets and no write permissions — a
  # compromised dependency cannot poison a later step that holds DEPENDABOT_PAT.
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: '24' # matches Dockerfile NODE_VERSION
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # SvelteKit reads PUBLIC_* env at build time, so set up .env first.
      - name: Setup environment variables
        run: cp .env.example .env

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Check sveltekit and typescript issues
        run: npm run check

  # Trusted job: does not checkout or execute PR code, so a compromised
  # dependency can never run with DEPENDABOT_PAT in scope. After verify passes,
  # it approves the PR with the trusted PAT (satisfying the develop ruleset's
  # required review) and enables auto-merge. Approval and merge are both pinned
  # to the exact head SHA that verify built, so a commit pushed to the PR
  # mid-run cannot inherit the approval. Required status checks are NOT
  # bypassed — auto-merge still waits for them, and we never use --admin.
  merge:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and auto-merge Dependabot PRs that build successfully
        # Approve the exact head SHA that verify built (commit_id), and refuse
        # to merge if the head moved since (--match-head-commit). Skip approval
        # when the PAT user has already approved THIS SHA — paginating the
        # reviews API so the check holds on long-lived PRs — which keeps re-runs
        # idempotent; --auto is a no-op when auto-merge is already enabled.
        run: |
          set -euo pipefail
          pat_user=$(gh api /user --jq .login)
          approvals=$(gh api --paginate "/repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '.[]' \
            | jq -s --arg u "$pat_user" --arg sha "$PR_HEAD_SHA" \
                '[.[] | select(.user.login == $u and .state == "APPROVED" and .commit_id == $sha)] | length')
          if [ "$approvals" -eq 0 ]; then
            gh api --method POST "/repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
              -f "commit_id=${PR_HEAD_SHA}" -f event=APPROVE
          else
            echo "Head ${PR_HEAD_SHA} already approved by ${pat_user}; skipping approval."
          fi
          gh pr merge "$PR_URL" --squash --delete-branch --auto --match-head-commit "$PR_HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
