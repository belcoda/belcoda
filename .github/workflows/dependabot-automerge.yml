name: Dependabot Auto-merge
on:
  pull_request:
    branches: [develop] # Dependabot targets develop (see .github/dependabot.yml)
  workflow_dispatch: # manual trigger for debugging the build/check steps

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Run for Dependabot PRs, or when dispatched manually for debugging.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # matches Dockerfile NODE_VERSION
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # SvelteKit reads PUBLIC_* env at build time, so set up .env first.
      - name: Setup environment variables
        run: cp .env.example .env

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Check sveltekit and typescript issues
        run: npm run check

      # Only merge real Dependabot PRs (not manual debug runs). --admin bypasses
      # branch protection since this workflow is itself the gating build/check.
      - name: Auto-merge Dependabot PRs that build successfully
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: gh pr merge --squash --delete-branch --admin "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
