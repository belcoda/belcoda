name: Dependabot Auto-merge
on:
  pull_request:
    branches: [develop] # Dependabot targets develop (see .github/dependabot.yml)
  workflow_dispatch: # manual trigger for debugging the build/check steps

permissions: {}

jobs:
  # Runs PR code (npm build/check). No secrets and no write permissions — a
  # compromised dependency cannot poison a later step that holds DEPENDABOT_PAT.
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: '24' # matches Dockerfile NODE_VERSION
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # SvelteKit reads PUBLIC_* env at build time, so set up .env first.
      - name: Setup environment variables
        run: cp .env.example .env

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Check sveltekit and typescript issues
        run: npm run check

  # Trusted job: does not checkout or execute PR code, so a compromised
  # dependency can never run with DEPENDABOT_PAT in scope. After verify passes,
  # it approves the PR with the trusted PAT (satisfying the develop ruleset's
  # required review) and enables auto-merge. Required status checks are NOT
  # bypassed — auto-merge still waits for them, and we never use --admin.
  merge:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and auto-merge Dependabot PRs that build successfully
        # Approve only if the PAT user has not already approved (keeps re-runs
        # idempotent); --auto is a no-op when auto-merge is already enabled.
        run: |
          set -euo pipefail
          pat_user=$(gh api /user --jq .login)
          already_approved=$(gh api "/repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${pat_user}\" and .state == \"APPROVED\")] | length")
          if [ "$already_approved" -eq 0 ]; then
            gh pr review "$PR_URL" --approve
          else
            echo "PR already approved by ${pat_user}; skipping approval."
          fi
          gh pr merge "$PR_URL" --squash --delete-branch --auto
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
