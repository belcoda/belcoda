name: Fly Deploy Staging with Stress Test Data

on:
  workflow_dispatch:
    inputs:
      seed_type:
        description: 'Type of seeds to run'
        required: true
        default: 'stress'
        type: choice
        options:
          - stress
          - normal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Install Node
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev

      # Start proxy and run drizzle stuff
      - name: Generate and run Drizzle migrations
        run: |
          flyctl proxy 5432 -a belcodadb-staging &
          PROXY_PID=$!
          sleep 5

          npx drizzle-kit migrate
          npm run prepare

          if [ "${{ github.event.inputs.seed_type }}" = "stress" ]; then
            echo "Running stress test seed..."
            npm run db:seed:stress
          else
            echo "Running normal seed..."
            npm run db:seed
          fi

          kill $PROXY_PID
        env:
          DATABASE_URL: ${{ secrets.PROXIED_STAGING_DATABASE_URL }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OWNER_EMAIL_ADDRESS: ${{ vars.SEED_OWNER_EMAIL_ADDRESSES }}
          OWNER_ORGANIZATION_NAME: ${{ vars.SEED_OWNER_ORGANIZATION_NAME }}
          OWNER_ORGANIZATION_SLUG: ${{ vars.SEED_OWNER_ORGANIZATION_SLUG }}
          OWNER_GIVEN_NAME: ${{ vars.SEED_OWNER_GIVEN_NAMES }}
          OWNER_FAMILY_NAME: ${{ vars.SEED_OWNER_FAMILY_NAMES }}
          OWNER_PROFILE_PIC_URL: ${{ vars.SEED_OWNER_PROFILE_PIC_URLS }}
          PUBLIC_DEFAULT_WHATSAPP_NUMBER: ${{ vars.PUBLIC_DEFAULT_WHATSAPP_NUMBER }}
          DEFAULT_WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ vars.DEFAULT_WHATSAPP_BUSINESS_ACCOUNT_ID }}
          POSTMARK_SENDING_DOMAIN: ${{ vars.POSTMARK_SENDING_DOMAIN }}
          PUBLIC_DEFAULT_WORKSPACE_LOGO: ${{ vars.PUBLIC_DEFAULT_WORKSPACE_LOGO }}

      # App deploy
      - name: Deploy app
        run: |
          flyctl deploy -c deploy/fly.staging.toml --remote-only \
            --build-arg PUBLIC_SENTRY_DSN="$PUBLIC_SENTRY_DSN" \
            --build-arg SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" \
            --build-arg PUBLIC_AWS_S3_SITE_UPLOADS_BUCKET_NAME="$PUBLIC_AWS_S3_SITE_UPLOADS_BUCKET_NAME"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN_STAGING }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_STAGING }}
          PUBLIC_AWS_S3_SITE_UPLOADS_BUCKET_NAME: ${{ secrets.PUBLIC_AWS_S3_SITE_UPLOADS_BUCKET_NAME_STAGING }}

      # Zero deploy
      - run: flyctl deploy -c deploy/fly.zero.staging.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
