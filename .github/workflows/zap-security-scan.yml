name: ZAP Security Scan (Staging)

on:
  workflow_run:
    workflows:
      - 'Fly Deploy Staging'
    types:
      - completed
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  zap-scan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://staging.belcoda.com'
          allow_issue_writing: true
          artifact_name: 'zap-report'
          fail_action: false
          cmd_options: '-x report_xml.xml'

      - name: Upload to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DD_TOKEN }}
        run: |
          test -f report_xml.xml || { echo "No ZAP XML report found — aborting upload"; exit 1; }
          curl -sS --fail-with-body -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
          -H "Authorization: Token $DD_TOKEN" \
          -F "file=@report_xml.xml" \
          -F "scan_type=ZAP Scan" \
          -F "product_name=Belcoda App" \
          -F "engagement_name=CI/CD: DAST - Staging" \
          -F "environment=Staging" \
          -F "close_old_findings=true" \
          -F "auto_create_context=true"
