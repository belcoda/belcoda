name: E2E (PR to develop)

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  e2e:
    # Skip Dependabot: bumps already get build/check via dependabot-automerge,
    # and a daily batch of Dependabot PRs would otherwise all contend for
    # shared staging at once (same pattern as fly-review.yml).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # All e2e jobs hit the same shared staging DB and call /api/e2e/cleanup at
    # start. Parallel runs race each other (signup 500s, "Owner user not found",
    # mid-test data wipes). Job-level concurrency so only eligible e2e jobs
    # acquire the staging lock; do not cancel in-progress runs from other PRs.
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: '24'
          cache: npm

      - name: Update npm
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list --json @playwright/test | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run e2e tests against staging
        run: npm run test:e2e
        env:
          E2E_BASE_URL: 'https://staging.belcoda.com'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: e2e-ctrf
          path: ctrf/
          retention-days: 7

      - name: Post test report to PR
        if: always()
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 #v1
        with:
          report-path: './ctrf/ctrf-report.json'
          pull-request-report: true
          failed-report: true
          flaky-report: true
          pull-request: true
          overwrite-comment: true
          comment-tag: 'e2e-results'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
